<!--
  Fragmento para insertar dentro de <ossec_config> en el agente
  instalado en la VM "víctima": /var/ossec/etc/ossec.conf

  Agrega este bloque <localfile> junto a los que ya existen (no
  reemplaces el archivo completo). Luego reinicia el agente:
      systemctl restart wazuh-agent
-->
<localfile>
  <log_format>syslog</log_format>
  <location>/var/log/api_access.log</location>
</localfile>
